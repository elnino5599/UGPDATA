<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E4A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DATA-UGP">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;padding:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>DATA-UGP</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
:root{
  --ink:#10232E; --ink-2:#3E5561; --ink-3:#6B808B;
  --ground:#EEF2F3; --surface:#FFFFFF; --surface-2:#F6F8F9; --line:#D5DEE2;
  --brand:#0E4A5C; --brand-ink:#FFFFFF; --brand-soft:#DCEBEF;
  --accent:#C98300; --accent-soft:#FCEFD3;
  --good:#1F7A4D; --good-soft:#DDF1E6; --warn:#B26A00; --warn-soft:#FBEBD0;
  --bad:#B3261E; --bad-soft:#F8DEDC; --off:#5B5B66; --off-soft:#E6E6EA;
  --info:#2F5F9E; --info-soft:#DFE9F7;
  --shadow:0 6px 24px rgba(16,35,46,.12);
  --display:"Archivo",system-ui,sans-serif; --body:"IBM Plex Sans",system-ui,sans-serif; --mono:"IBM Plex Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ink:#E4ECEF; --ink-2:#AFC0C7; --ink-3:#7F939C;
  --ground:#0C171C; --surface:#13232A; --surface-2:#182C34; --line:#27404A;
  --brand:#5FB3C9; --brand-ink:#06202A; --brand-soft:#173A45;
  --accent:#F0AE3C; --accent-soft:#3A2C12;
  --good:#5CC38D; --good-soft:#123326; --warn:#E9A649; --warn-soft:#3A2A12;
  --bad:#F07B72; --bad-soft:#3B1917; --off:#A5A5B2; --off-soft:#2A2A31;
  --info:#83AEE8; --info-soft:#17263B;
  --shadow:0 6px 24px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E4ECEF; --ink-2:#AFC0C7; --ink-3:#7F939C;
  --ground:#0C171C; --surface:#13232A; --surface-2:#182C34; --line:#27404A;
  --brand:#5FB3C9; --brand-ink:#06202A; --brand-soft:#173A45;
  --accent:#F0AE3C; --accent-soft:#3A2C12;
  --good:#5CC38D; --good-soft:#123326; --warn:#E9A649; --warn-soft:#3A2A12;
  --bad:#F07B72; --bad-soft:#3B1917; --off:#A5A5B2; --off-soft:#2A2A31;
  --info:#83AEE8; --info-soft:#17263B;
  --shadow:0 6px 24px rgba(0,0,0,.45);
}
/* Plein soleil : contraste renforcé, toujours clair */
:root[data-contrast="high"]{
  color-scheme:light;
  --ink:#000000; --ink-2:#1A1A1A; --ink-3:#333333;
  --ground:#FFFFFF; --surface:#FFFFFF; --surface-2:#F2F2F2; --line:#000000;
  --brand:#002B38; --brand-ink:#FFFFFF; --brand-soft:#CFE3EA;
  --accent:#8A5A00; --accent-soft:#FFE7B3;
  --good:#00552F; --good-soft:#C9F0D9; --warn:#7A4700; --warn-soft:#FFE1B0;
  --bad:#8E0000; --bad-soft:#FFD0CC; --off:#2B2B33; --off-soft:#DADADF;
  --info:#0B3D80; --info-soft:#D2E2FA;
  --shadow:none;
}
:root[data-contrast="high"] body{font-size:16px}
:root[data-contrast="high"] .card,:root[data-contrast="high"] .site,:root[data-contrast="high"] .dom{border-width:2px}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);margin:0;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:820px;margin:0 auto;padding-inline:16px;padding-block:0 24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
button:disabled{cursor:default}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.eyebrow{font:600 11px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
a{color:var(--brand)}

/* barre du haut */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink)}
.top .wrap{display:flex;align-items:center;gap:10px;padding-block:12px}
.top .back{background:none;border:0;color:inherit;font-size:22px;line-height:1;padding:4px 8px 4px 0}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font:800 17px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;letter-spacing:.01em}
.top .ttl small{font-size:12px;opacity:.85;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sync{font:500 11px/1 var(--body);padding:6px 9px;border-radius:99px;background:rgba(255,255,255,.16);white-space:nowrap}
.sync.off{background:var(--accent);color:#1c1300}
.gear{background:rgba(255,255,255,.12);border:0;color:inherit;border-radius:9px;width:34px;height:34px;display:grid;place-items:center;flex:none}
.gear svg{width:19px;height:19px}
.stripe{height:4px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--ink) 10px 20px);opacity:.9}
.me{font-size:11.5px;opacity:.85}

/* navigation basse */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:820px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--ink-3)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--brand);font-weight:700}
.nav button:disabled{opacity:.35}

section.view{padding-top:18px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}
.stackv{display:flex;flex-direction:column;gap:10px}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px;text-decoration:none;color:var(--ink)}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.accent{background:var(--accent);color:#1c1300;border-color:var(--accent)}
.btn.good{background:var(--good);color:#fff;border-color:var(--good)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.block{width:100%;justify-content:center}
.btn:disabled{opacity:.45}
.btn svg{width:16px;height:16px}

/* filtres */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 11px;font-size:13px;font-weight:500}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--ground);border-color:var(--ink)}
.search{flex:1;min-width:160px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:9px 11px}

/* cartes bureau */
.sites{display:flex;flex-direction:column;gap:10px}
.site{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.site h3{font-size:17px}
.site .open{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px;width:100%;box-sizing:border-box}
.site .open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.site .acts{display:flex;border-top:1px solid var(--line)}
.site .acts button{flex:1;background:none;border:0;padding:10px;font-size:13.5px;font-weight:600;color:var(--brand)}
.site .acts button+button{border-left:1px solid var(--line)}
.site .acts .del{color:var(--bad)}
.site .meta{font-size:13px;color:var(--ink-2)}
.pct{font:700 20px/1 var(--display);color:var(--brand);text-align:right;font-variant-numeric:tabular-nums}
.pct small{display:block;font:500 11px/1.4 var(--body);color:var(--ink-3)}
.bar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--brand)}
.tag{display:inline-block;font:600 11px/1 var(--body);padding:4px 7px;border-radius:6px;background:var(--accent-soft);color:var(--warn);letter-spacing:.03em;vertical-align:2px}
.status{display:inline-flex;align-items:center;gap:5px;font:600 11.5px/1 var(--body);padding:4px 8px;border-radius:99px;white-space:nowrap;vertical-align:2px}
.status::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.st-Brouillon{background:var(--off-soft);color:var(--off)}
.st-Soumis{background:var(--info-soft);color:var(--info)}
.st-Valide{background:var(--good-soft);color:var(--good)}
.st-Corriger{background:var(--warn-soft);color:var(--warn)}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:18px;color:var(--ink-2);background:var(--surface)}
.hint{font-size:12.5px;color:var(--ink-3)}

/* domaines */
.domains{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:440px){.domains{grid-template-columns:1fr}}
.dom{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;text-align:left}
.dom .h{display:flex;gap:10px;align-items:center}
.dom .ic{width:36px;height:36px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.dom .ic svg{width:20px;height:20px}
.dom b{font:700 14.5px/1.2 var(--display);flex:1}
.sc{display:inline-block;font:700 13px/1 var(--mono);padding:4px 6px;border-radius:6px;font-variant-numeric:tabular-nums}
.dom .s{font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between;gap:8px}
.dom .bar{height:5px}
.dom.done .ic{background:var(--good-soft);color:var(--good)}
.dom .flags{display:flex;gap:6px;flex-wrap:wrap}
.flag{font:600 11px/1 var(--body);padding:3px 6px;border-radius:5px}
.flag.w{background:var(--warn-soft);color:var(--warn)}
.flag.c{background:var(--bad-soft);color:var(--bad)}
.flag.r{background:var(--info-soft);color:var(--info)}
.sc-hi{background:var(--good-soft);color:var(--good)}
.sc-mid{background:var(--warn-soft);color:var(--warn)}
.sc-lo{background:var(--bad-soft);color:var(--bad)}
.sc-na{background:var(--off-soft);color:var(--off)}

/* formulaires */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.fields{display:flex;flex-direction:column;gap:14px}
.f label,.f .lab{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.f .unit{font-weight:400;color:var(--ink-3)}
.f input,.f select,.f textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:15px}
.f input:disabled,.f select:disabled,.f textarea:disabled{opacity:.7}
.f textarea{min-height:84px;resize:vertical}
.f .custom{font:600 10px/1 var(--body);letter-spacing:.06em;color:var(--info);background:var(--info-soft);padding:2px 5px;border-radius:4px;margin-left:6px;vertical-align:1px}
.f .fmsg{font-size:12.5px;margin-top:5px}
.f .fmsg.w{color:var(--warn)}
.f .fmsg.c{color:var(--bad)}
.f .fmsg.i{color:var(--ink-3)}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:7px 12px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg button:disabled{opacity:.6}
.seg.st button[aria-pressed="true"][data-v="Bon"]{background:var(--good);border-color:var(--good);color:#fff}
.seg.st button[aria-pressed="true"][data-v="Passable"]{background:var(--warn);border-color:var(--warn);color:#fff}
.seg.st button[aria-pressed="true"][data-v="Mauvais"]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg.st button[aria-pressed="true"][data-v="Hors service"]{background:var(--off);border-color:var(--off);color:#fff}
.inline{display:flex;gap:8px}
.inline input{flex:1;min-width:0}

/* équipements */
.eq{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);text-align:left;width:100%}
.item b{font-weight:600}
.item .sub{font-size:12.5px;color:var(--ink-2)}
.pill{font:600 11.5px/1 var(--body);padding:5px 8px;border-radius:99px;white-space:nowrap;align-self:start}
.p-Bon{background:var(--good-soft);color:var(--good)}
.p-Passable{background:var(--warn-soft);color:var(--warn)}
.p-Mauvais{background:var(--bad-soft);color:var(--bad)}
.p-Hors{background:var(--off-soft);color:var(--off)}

/* photos */
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:8px}
.ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;border:1px solid var(--line);background:var(--surface-2);padding:0;max-width:100%}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph .pend{position:absolute;left:4px;bottom:4px;font:600 10px/1 var(--body);background:var(--accent);color:#1c1300;padding:3px 5px;border-radius:4px}
.addph{border:1.5px dashed var(--line);border-radius:10px;aspect-ratio:1;display:grid;place-items:center;text-align:center;font-size:12.5px;font-weight:600;color:var(--brand);background:var(--surface);cursor:pointer;padding:6px}
.addph svg{width:22px;height:22px;display:block;margin:0 auto 4px}
.ph .gpsb{position:absolute;right:4px;top:4px;font:700 9.5px/1 var(--body);background:var(--brand);color:var(--brand-ink);padding:3px 4px;border-radius:4px;letter-spacing:.04em}
.docrow{align-items:center}
.lightbox img{width:100%;border-radius:10px;max-height:62vh;object-fit:contain;background:#000}

/* feuille modale */
.scrim{position:fixed;inset:0;background:rgba(6,18,24,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:820px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.sheet .grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:440px){.grid2,.grid3{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* bandeaux */
.banner{border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;gap:10px;align-items:flex-start;flex-wrap:wrap}
.banner.lock{background:var(--good-soft);color:var(--good)}
.banner.fix{background:var(--warn-soft);color:var(--warn)}
.banner.info{background:var(--info-soft);color:var(--info)}
.banner b{color:inherit}
.banner .txt{flex:1;min-width:200px}
.review{border-left:4px solid var(--info);background:var(--info-soft);padding:10px 12px;border-radius:0 10px 10px 0;font-size:13.5px;color:var(--ink)}

/* alertes */
.alerts{display:flex;flex-direction:column;gap:6px}
.al{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:9px 12px;border-radius:10px;font-size:13.5px;align-items:start}
.al .lv{font:700 10.5px/1.6 var(--body);letter-spacing:.06em;text-transform:uppercase;padding:1px 6px;border-radius:4px}
.al.c{background:var(--bad-soft)} .al.c .lv{background:var(--bad);color:#fff}
.al.w{background:var(--warn-soft)} .al.w .lv{background:var(--warn);color:#fff}
.al .dm{grid-column:2;font-size:12px;color:var(--ink-3)}

/* rapport */
.rep{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:18px}
.rep h2{font-size:22px}
.rep h3{font-size:16px;padding-bottom:6px;border-bottom:2px solid var(--brand);color:var(--brand)}
.rep h4{font:700 13.5px/1.3 var(--display);margin:4px 0 0;color:var(--ink-2)}
.entete{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:start;border-bottom:3px double var(--brand);padding-bottom:12px}
.entete .l{font:700 11.5px/1.45 var(--body);letter-spacing:.04em;text-transform:uppercase;color:var(--ink-2)}
.entete .r{text-align:right;font-size:12px;color:var(--ink-3)}
.flagdrc{display:inline-block;width:34px;height:23px;border-radius:2px;vertical-align:middle;margin-bottom:6px;background:linear-gradient(153deg,#007FFF 0 38%,#F7D618 38% 42%,#CE1021 42% 58%,#F7D618 58% 62%,#007FFF 62%)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:540px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi b{display:block;font:800 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink-3)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);font-weight:600;color:var(--ink-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl td.n,.tbl th.n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tfoot td{font-weight:700;background:var(--surface-2)}
.kv{display:grid;grid-template-columns:minmax(120px,42%) 1fr;font-size:13.5px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv div{padding:7px 10px;border-bottom:1px solid var(--line)}
.kv div:nth-child(odd){background:var(--surface-2);color:var(--ink-2)}
.kv div:nth-last-child(-n+2){border-bottom:0}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.prose{font-size:14px;line-height:1.6;white-space:pre-wrap}
.sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:540px){.sigs{grid-template-columns:1fr}}
.sig{border:1px solid var(--line);border-radius:10px;padding:10px;min-height:96px;font-size:12.5px;color:var(--ink-2);display:flex;flex-direction:column;justify-content:space-between}
.sig b{color:var(--ink)}
.toc{font-size:13.5px;columns:2;column-gap:24px;margin:0;padding-left:20px}
@media (max-width:540px){.toc{columns:1}}
.rphotos{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.rphotos figure{margin:0;font-size:11.5px;color:var(--ink-3)}
.rphotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line)}

/* graphiques */
.chart{width:100%;height:auto;display:block;max-width:100%}
.chart text{fill:var(--ink-2);font:11px var(--body)}
.chart .t-strong{fill:var(--ink);font-weight:600}
.hbars{display:flex;flex-direction:column;gap:7px}
.hb{display:grid;grid-template-columns:minmax(90px,34%) 1fr 44px;gap:8px;align-items:center;font-size:13px}
.hb .tr{height:12px;background:var(--surface-2);border-radius:6px;overflow:hidden;border:1px solid var(--line)}
.hb .tr i{display:block;height:100%;border-radius:6px 0 0 6px}
.hb .v{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
.hb .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dash2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:640px){.dash2{grid-template-columns:1fr}}
.pipeline{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media (max-width:440px){.pipeline{grid-template-columns:repeat(2,1fr)}}
.pipeline div{border-radius:10px;padding:10px;text-align:left}
.pipeline b{display:block;font:800 24px/1.1 var(--display);font-variant-numeric:tabular-nums}
.pipeline span{font-size:12px}

/* historique */
.hist{display:flex;flex-direction:column;gap:0;font-size:13px}
.hist div{display:grid;grid-template-columns:auto 1fr;gap:2px 10px;padding:7px 0;border-bottom:1px solid var(--line)}
.hist div:last-child{border-bottom:0}
.hist time{font-family:var(--mono);font-size:11.5px;color:var(--ink-3);white-space:nowrap}
.ai-out{min-height:80px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}

function isFilled(v){return !(v===undefined||v===null||v==="")}
function monthsSince(d){if(!d)return null;const x=new Date(d+"T00:00:00");if(isNaN(x))return null;return (Date.now()-x.getTime())/(30.44*864e5)}
function num(v){return isFilled(v)&&!isNaN(Number(v))?Number(v):null}
function clamp(x,a,b){return Math.max(a,Math.min(b,x))}
function money(n){return (Number(n)||0).toLocaleString("fr-FR",{maximumFractionDigits:0})+" USD"}

function parseGPS(txt){

  let m=t.match(/@(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/)||t.match(/[?&](?:q|ll|query)=(-?\d+(?:\.\d+)?),\s*(-?\d+(?:\.\d+)?)/)||t.match(/mlat=(-?\d+(?:\.\d+)?).*mlon=(-?\d+(?:\.\d+)?)/);
  if(m)return{lat:+m[1],lon:+m[2]};
  const dms=[...t.matchAll(/(\d+(?:[.,]\d+)?)\s*°\s*(?:(\d+(?:[.,]\d+)?)\s*['’′]\s*)?(?:(\d+(?:[.,]\d+)?)\s*(?:["”″]|'')\s*)?([NSEOW])/gi)];
  if(dms.length>=2){const cv=x=>{const d=+x[1].replace(",","."),mi=+(x[2]||"0").replace(",","."),s=+(x[3]||"0").replace(",",".");let v=d+mi/60+s/3600;if(/[SOW]/i.test(x[4]))v=-v;return{v,ax:/[NS]/i.test(x[4])?"lat":"lon"}};
    const a=cv(dms[0]),b=cv(dms[1]);const r={};r[a.ax]=a.v;r[b.ax]=b.v;if(r.lat!==undefined&&r.lon!==undefined)return r}
  m=t.match(/(-?\d+(?:[.]\d+)?)\s*[,;\s]\s*(-?\d+(?:[.]\d+)?)/);
  if(m){const lat=+m[1],lon=+m[2];if(Math.abs(lat)<=90&&Math.abs(lon)<=180)return{lat,lon}}
  return null}
function inDRC(p){return p&&p.lat>=-13.6&&p.lat<=5.5&&p.lon>=12&&p.lon<=31.4}
function gpsTxt(p){return p.lat.toFixed(6)+", "+p.lon.toFixed(6)}
function osmLink(p){return`https://www.openstreetmap.org/?mlat=${p.lat.toFixed(6)}&mlon=${p.lon.toFixed(6)}#map=16/${p.lat.toFixed(5)}/${p.lon.toFixed(5)}`}

let flushT=null,flushing=false;function flushSoon(){clearTimeout(flushT);flushT=setTimeout(flush,700)}
async function flush(){
  if(!db||flushing)return;flushing=true;
  try{
  for(const k of Object.keys(S.dirty)){
    const [t,id,key]=k.split(":");
    try{
      if(t==="x"){
        await db.doc("sites/"+id).delete();
        for(const d of DOMAINS)await db.doc("domaines/"+id+"__"+d.key).delete();
        try{const ph=await db.collection("photos").where("siteId","==",id).get();for(const p of ph.docs)await db.doc("photos/"+p.id).delete()}catch(e){}
        try{const dc=await db.collection("documents").where("siteId","==",id).get();for(const x of dc.docs){const v=x.data()||{};if(v.assetId&&assetsNS){try{await assetsNS.delete(v.assetId)}catch(e){}}await db.doc("documents/"+x.id).delete()}}catch(e){}
      }else if(t==="s"){const s=S.sites[id];if(s)await db.doc("sites/"+id).set({meta:s.meta,createdAt:s.createdAt||Date.now(),updatedAt:s.updatedAt||Date.now()})}
      else if(t==="d"){const s=S.sites[id];if(s){const d=dom(s,key);const o={siteId:id,key,fields:d.fields,items:d.items,updatedAt:d.updatedAt||Date.now()};
        if(d.actions)o.actions=d.actions;if(d.review)o.review=d.review;if(d.updatedBy)o.updatedBy=d.updatedBy;await db.doc("domaines/"+id+"__"+key).set(o)}}
      else if(t==="p"){const p=PHOTOS[id]||await idbGet(id);if(p){const o=Object.assign({},p);delete o.pending;await db.doc("photos/"+id).set(o);p.pending=false;PHOTOS[id]&&(PHOTOS[id].pending=false);await idbPut(p)}}
      else if(t==="q"){await db.doc("photos/"+id).delete()}
      else if(t==="k"){const m=DOCS[id];const rec=await docGet(id);if(m&&rec&&rec.blob){
          if(assetsNS&&!m.assetId&&!m.localOnly){try{const up=await assetsNS.upload(rec.blob);m.assetId=up.id;m.url=up.url}catch(e){if(e&&["too_large","unsupported_type","not_granted","quota_or_state","capability_disabled"].includes(e.code)){m.localOnly=true;rec.localOnly=true}else throw e}}
          const o={siteId:m.siteId,dom:m.dom,name:m.name,type:m.type,size:m.size,at:m.at,localOnly:!!m.localOnly};if(m.assetId){o.assetId=m.assetId;o.url=m.url}
          await db.doc("documents/"+id).set(o);m.pending=false;rec.pending=false;Object.assign(rec,{assetId:m.assetId||null,url:m.url||null});await docPut(rec)}}
      else if(t==="j"){try{await db.doc("documents/"+id).delete()}catch(e){}if(key&&assetsNS){try{await assetsNS.delete(key)}catch(e){}}}
      else if(t==="h"){const h=S.hq[id];if(h)await db.doc("historique/"+id).set(h);delete S.hq[id]}
      delete S.dirty[k];
    }catch(e){ if(e&&e.code==="invalid_argument"){delete S.dirty[k];toast("Enregistrement refusé : votre accès ne permet pas d'écrire.")} else break;}
  }}finally{flushing=false}
  lsSave();setSync();if(view.name==="domain")refreshPhotoBadges();
}

let subSite=null,unsubs=[];
function subscribeSite(id){
  if(subSite===id)return;unsubs.forEach(u=>{try{u()}catch(e){}});unsubs=[];subSite=id;
  if(!id||id===DEMO_ID)return;
  idbBySite(id).then(list=>{list.forEach(p=>{if(!PHOTOS[p.id])PHOTOS[p.id]=p});softRender()});
  docsBySite(id).then(list=>{list.forEach(x=>{const m=Object.assign({},x);delete m.blob;DOCS[x.id]=Object.assign(DOCS[x.id]||{},m)});softRender()});
  if(!db)return;
  unsubs.push(db.collection("photos").where("siteId","==",id).onSnapshot(snap=>{
    const seen=new Set();
    snap.docs.forEach(doc=>{const v=doc.data()||{};seen.add(doc.id);if(S.dirty["q:"+doc.id])return;if(!PHOTOS[doc.id]||PHOTOS[doc.id].pending===false){const p=Object.assign({id:doc.id},v,{pending:false});PHOTOS[doc.id]=p;idbPut(p)}});
    Object.values(PHOTOS).forEach(p=>{if(p.siteId===id&&!p.pending&&!seen.has(p.id)){delete PHOTOS[p.id];idbDel(p.id)}});
    softRender()},()=>{}));
  unsubs.push(db.collection("documents").where("siteId","==",id).onSnapshot(snap=>{
    const seen=new Set();
    snap.docs.forEach(doc=>{const v=doc.data()||{};seen.add(doc.id);if(S.dirty["j:"+doc.id])return;DOCS[doc.id]=Object.assign(DOCS[doc.id]||{id:doc.id},v,{pending:false})});
    Object.values(DOCS).forEach(x=>{if(x.siteId===id&&!x.pending&&!seen.has(x.id)&&!S.dirty["k:"+x.id]){delete DOCS[x.id];docDel(x.id)}});
    softRender()},()=>{}));
  unsubs.push(db.collection("historique").where("siteId","==",id).onSnapshot(snap=>{
    const pend=Object.values(S.hq).filter(h=>h.siteId===id);
    HIST[id]=pend.concat(snap.docs.map(d=>d.data()||{})).sort((a,b)=>(b.at||0)-(a.at||0));
    resolveNames(HIST[id].map(h=>h.by));if(view.name==="site")softRender()},()=>{}));
}

async function connect(){
  try{

      downloads={save:async({filename,data})=>{const b=data instanceof Blob?data:new Blob([data],{type:/\.html$/.test(filename)?"text/html;charset=utf-8":/\.csv$/.test(filename)?"text/csv;charset=utf-8":"application/octet-stream"});
        try{const file=new File([b],filename,{type:b.type});if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return}}catch(e){if(e&&e.name==="AbortError")throw{code:"declined"}}
        const a=document.createElement("a");a.href=URL.createObjectURL(b);a.download=filename;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},1000)}};

    },()=>{});
    db.collection("domaines").onSnapshot(snap=>{
      snap.docs.forEach(doc=>{const v=doc.data()||{};const id=v.siteId,key=v.key;if(!id||!key||!S.sites[id])return;

        S.sites[id].domains=S.sites[id].domains||{};S.sites[id].domains[key]={fields:v.fields||{},items:v.items||[],actions:v.actions||[],review:v.review||null,updatedAt:v.updatedAt,updatedBy:v.updatedBy||null}});
      lsSave();softRender();
    },()=>{});

      snap.docs.forEach(doc=>{const v=doc.data()||{};

        if(doc.id==="questions")CFG.questions=v.extra||{};

      softRender()},()=>{});
    db.doc("syntheses/national").onSnapshot(s=>{NATIONAL=s.exists?s.data():null;if(view.name==="dash")softRender()},()=>{});
    if(view.site)subscribeSite(view.site);

}

/* ---------------- Radar ---------------- */
function radar(scores,prev,size){
  const keys=SCORED;const n=keys.length;const H=size||320,W=H+170,cx=W/2,cy=H/2,R=H/2-26;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;const r=R*(v??0)/100;return[cx+r*Math.cos(a),cy+r*Math.sin(a)]};
  let g="";[25,50,75,100].forEach(l=>{g+=`<polygon points="${keys.map((_,i)=>pt(i,l).join(",")).join(" ")}" fill="none" stroke="var(--line)" stroke-width="1"/>`});
  keys.forEach((k,i)=>{const [x,y]=pt(i,100);g+=`<line x1="${cx}" y1="${cy}" x2="${x}" y2="${y}" stroke="var(--line)"/>`;
    const a=-Math.PI/2+i*2*Math.PI/n;const lx=cx+(R+12)*Math.cos(a),ly=cy+(R+12)*Math.sin(a);const anc=Math.abs(Math.cos(a))<.2?"middle":Math.cos(a)>0?"start":"end";
    g+=`<text x="${lx.toFixed(1)}" y="${(ly+ (Math.sin(a)>.5?9:Math.sin(a)<-.5?-2:4)).toFixed(1)}" text-anchor="${anc}">${esc(SHORT[k])} <tspan class="t-strong">${scores[k]??"—"}</tspan></text>`});
  const poly=(sc,col,fop,dash)=>`<polygon points="${keys.map((k,i)=>pt(i,sc[k]).join(",")).join(" ")}" fill="${col}" fill-opacity="${fop}" stroke="${col}" stroke-width="2" ${dash?'stroke-dasharray="4 3"':""}/>`;
  if(prev)g+=poly(prev,"var(--ink-3)",0,true);
  g+=poly(scores,"var(--brand)",.2);
  keys.forEach((k,i)=>{if(scores[k]!==null&&scores[k]!==undefined){const [x,y]=pt(i,scores[k]);g+=`<circle cx="${x}" cy="${y}" r="3" fill="var(--brand)"/>`}});
  return`<svg class="chart" viewBox="0 0 ${W} ${H}" role="img" aria-label="Scores de maturité par domaine">${g}</svg>`}
function scoresOf(site){const o={};SCORED.forEach(k=>o[k]=domScore(site,k));return o}
function hbars(rows,max,colorFn,fmt){const m=max||Math.max(1,...rows.map(r=>r[1]||0));
  return`<div class="hbars">${rows.map(([l,val])=>`<div class="hb"><span class="nm" title="${esc(l)}">${esc(l)}</span><span class="tr"><i style="width:${val===null?0:clamp(val/m*100,0,100)}%;background:${colorFn?colorFn(val):"var(--brand)"}"></i></span><span class="v">${val===null?"—":fmt?fmt(val):val}</span></div>`).join("")}</div>`}

    as.addEventListener("focus",run);as.addEventListener("input",()=>{if(!as.value.trim())assigne=null;clearTimeout(t);t=setTimeout(run,250)})}
  document.getElementById("siteForm").onsubmit=ev=>{ev.preventDefault();

/* ---------------- Nouvelle visite (suivi) ---------------- */
function newVisit(s){
  confirmSheet(`Nouvelle visite de « ${esc(s.meta.nom)} » ?`,`Une nouvelle fiche est créée avec les réponses de la visite du ${fmtDate(s.meta.date)} comme point de départ. Vous mettez à jour ce qui a changé ; le rapport compare ensuite les deux visites.`,"Créer la nouvelle visite",()=>{
    const nid=uid();const copy=JSON.parse(JSON.stringify(s.domains||{}));Object.values(copy).forEach(d=>{delete d.review;delete d.updatedBy});
    const meta=Object.assign({},s.meta,{date:new Date().toISOString().slice(0,10),statut:"Brouillon",prev:s.id,statutBy:null,statutAt:null,statutNote:"",synthese:"",agent:ME.name||s.meta.agent,assigne:ME.id||s.meta.assigne||null});
    S.sites[nid]={id:nid,meta,domains:copy,createdAt:Date.now(),updatedAt:Date.now()};
    mark("s:"+nid);Object.keys(copy).forEach(k=>mark("d:"+nid+":"+k));log(nid,"Visite de suivi créée à partir de la visite du "+fmtDate(s.meta.date));toast("Nouvelle visite créée");go("site",nid)},"primary")}

/* ---------------- Workflow ---------------- */
function setStatut(s,statut,note){s.meta.statut=statut;s.meta.statutBy=ME.id||null;s.meta.statutAt=Date.now();s.meta.statutNote=note||"";s.updatedAt=Date.now();mark("s:"+s.id);
  log(s.id,"Statut : "+statut+(note?" — "+note:""));toast("Statut : "+statut);render()}
function workflowCard(s){if(s.demo)return"";const stt=statutOf(s)==="Validé"?"Validé":"Brouillon";const m=s.meta;
  const body=stt==="Validé"?`Fiche validée le ${fmtDT(m.statutAt)} et verrouillée.`:"Collecte en cours. Quand tout est rempli, validez la fiche : elle passe en lecture seule et le rapport est prêt.";
  const acts=stt==="Validé"?`<button class="btn small" data-wf="Brouillon">Rouvrir la fiche</button>`:`<button class="btn small good" data-wf="Validé">Valider la fiche</button>`;
  return`<div class="card stackv"><div class="row spread"><div class="eyebrow">Statut de la fiche</div>${statusChip(stt)}</div><div style="font-size:14px">${body}</div><div class="row">${acts}</div></div>`}
function bindWorkflow(s){app.querySelectorAll("[data-wf]").forEach(b=>b.onclick=()=>{const to=b.dataset.wf;
  if(to==="Validé"){const stt=siteStats(s);const crit=siteChecks(s).filter(x=>x.lv==="c").length;
    confirmSheet("Valider la fiche ?",`Collecte remplie à ${stt.pct} %${crit?`, ${crit} alerte(s) critique(s)`:""}. La fiche passera en lecture seule ; vous pourrez la rouvrir.`,"Valider",()=>setStatut(s,"Validé"),"good");return}
  setStatut(s,to)})}

  if(fd.t==="seg"||fd.t==="state"){const opts=fd.t==="state"?STATES:fd.o||[];
    return`<div class="f" data-f="${fd.k}"><span class="lab" id="${id}_l">${esc(fd.l)}${cu}</span><div class="seg ${fd.t==="state"?"st":""}" role="group" aria-labelledby="${id}_l" data-k="${fd.k}">${opts.map(o=>`<button type="button" data-v="${esc(o)}" aria-pressed="${o===val}" ${dis}>${esc(o)}</button>`).join("")}</div>${mh}</div>`}

  else if(fd.t==="area")inner=`<textarea id="${id}" data-k="${fd.k}" ${dis}>${esc(val)}</textarea>`;

    inner=`<div class="inline"><input id="${id}" data-k="${fd.k}" class="mono" value="${esc(val)}" placeholder="-4.3250, 15.3222 ou lien Google Maps" ${dis}>${ro?"":`<button type="button" class="btn small" data-geo="${fd.k}">${icon("pin")}Ma position</button>`}${p?`<a class="btn small" href="${osmLink(p)}" target="_blank" rel="noopener">Carte</a>`:""}</div>
     <div class="fmsg i">« Ma position » utilise le GPS du téléphone. Si la position n'est pas disponible, collez les coordonnées ou un lien Google Maps : ils sont convertis automatiquement. Les photos prises avec le GPS activé remplissent aussi ce champ.</div>`}
  else{const type=fd.t==="num"?"number":fd.t==="date"?"date":"text";

async function compress(file){
  const url=URL.createObjectURL(file);
  try{const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=rej;i.src=url});
    let max=1280,q=.62,out="";
    for(let n=0;n<6;n++){const r=Math.min(1,max/Math.max(img.naturalWidth,img.naturalHeight));const w=Math.round(img.naturalWidth*r),h=Math.round(img.naturalHeight*r);
      const c=document.createElement("canvas");c.width=w;c.height=h;c.getContext("2d").drawImage(img,0,0,w,h);out=c.toDataURL("image/jpeg",q);
      if(out.length<200000)return{data:out,w,h};max=Math.round(max*.8);q=Math.max(.4,q-.06)}
    return{data:out}}finally{URL.revokeObjectURL(url)}}

/* ---------------- Position GPS ---------------- */
function getPosition(){return new Promise(res=>{if(!navigator.geolocation){res(null);return}let done=false;const t=setTimeout(()=>{if(!done){done=true;res(null)}},12000);
  try{navigator.geolocation.getCurrentPosition(p=>{if(done)return;done=true;clearTimeout(t);res({lat:p.coords.latitude,lon:p.coords.longitude,acc:p.coords.accuracy})},()=>{if(done)return;done=true;clearTimeout(t);res(null)},{enableHighAccuracy:true,timeout:11000,maximumAge:60000})}catch(e){done=true;clearTimeout(t);res(null)}})}
async function exifGPS(file){try{if(!/jpe?g/i.test(file.type||file.name))return null;const buf=await file.slice(0,262144).arrayBuffer();const v=new DataView(buf);

  while(o<v.byteLength-4){const mk=v.getUint16(o);if(mk===0xFFE1){const st=o+4;if(v.getUint32(st)!==0x45786966)return null;const t=st+6;const le=v.getUint16(t)===0x4949;
    const u16=x=>v.getUint16(x,le),u32=x=>v.getUint32(x,le);const ifd0=t+u32(t+4);let gpsOff=null;
    for(let i=0,n=u16(ifd0);i<n;i++){const e=ifd0+2+i*12;if(u16(e)===0x8825)gpsOff=t+u32(e+8)}
    if(!gpsOff)return null;const g={};

   if((mk&0xFF00)!==0xFF00)return null;o+=2+v.getUint16(o+2)}return null}catch(e){return null}}

function siteDigest(s){const o={bureau:s.meta.nom,code:s.meta.code,province:s.meta.province,ville:s.meta.ville,date_visite:s.meta.date,score_global:siteScore(s),domaines:{}};

function consolidatedHTML(list){return`<div class="rep"><div class="entete"><div class="l"><span class="flagdrc" aria-hidden="true"></span><br>République Démocratique du Congo<br>Ministère des Finances<br>UGP-MOD</div><div class="r">${new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"})}</div></div>

function renderReport(){
  const s=view.site&&getSite(view.site);
  setTop("Rapport",s?(s.meta&&s.meta.nom)||"":"Choisir un bureau",!!s);
  const list=sitesSorted();
  if(!s){app.innerHTML=`<section class="view"><div class="eyebrow">Choisissez le bureau dont vous voulez le rapport</div>
    <div class="sites">${list.map(siteCard).join("")||siteCard(DEMO)}</div>${list.length?`<div class="note">Les exports consolidés (tous les bureaux) sont dans le Tableau de bord.</div>`:""}</section>`;
    app.querySelectorAll("[data-open]").forEach(b=>b.onclick=()=>go("report",b.dataset.open));app.querySelectorAll("[data-rep]").forEach(b=>b.onclick=()=>go("report",b.dataset.rep));
    app.querySelectorAll("[data-edit]").forEach(b=>b.onclick=()=>siteSheet(b.dataset.edit));app.querySelectorAll("[data-del]").forEach(b=>b.onclick=()=>askDeleteSite(b.dataset.del));return}
  const canAI=!!sampleNS&&(!locked(s)||ME.sup);
  app.innerHTML=`<section class="view">
   <div class="card"><div class="eyebrow" style="margin-bottom:10px">Exporter</div><div class="row">
     <button class="btn small primary" id="dlHtml" ${downloads?"":"disabled"}>Rapport officiel (.html)</button>
     <button class="btn small" id="dlXls" ${downloads?"":"disabled"}>Classeur Excel (.xlsx)</button>
     <button class="btn small" id="dlCsv" ${downloads?"":"disabled"}>Inventaire (.csv)</button></div>
     <div class="hint" style="margin-top:8px">${downloads?"Le rapport .html s'ouvre dans un navigateur ou dans Word, avec les photos. Depuis le navigateur, « Imprimer › Enregistrer en PDF » donne la version PDF.":"L'export de fichiers n'est pas disponible dans cette vue."}</div></div>
   <div class="card stackv"><div class="row spread"><div class="eyebrow">Synthèse du rapport</div>${canAI?`<button class="btn small primary" id="aiBtn">${icon("spark")}${s.meta.synthese?"Régénérer avec l'IA":"Rédiger avec l'IA"}</button>`:""}</div>
    <div class="f"><label for="synEdit" class="hint" style="font-weight:400">${s.meta.synthese?`Rédigée le ${fmtDT(s.meta.syntheseAt)}. Vous pouvez la corriger directement.`:"Aucune synthèse rédigée : le rapport utilise un résumé automatique. Rédigez-la avec l'IA ou saisissez-la."}</label>
     <textarea id="synEdit" style="min-height:140px" ${s.demo||(locked(s)&&!ME.sup)?"disabled":""} placeholder="${esc(autoSynthese(s))}">${esc(s.meta.synthese||"")}</textarea></div>
    <div class="prose ai-out" id="aiOut" hidden></div>
    ${s.demo||(locked(s)&&!ME.sup)?"":`<div class="row"><button class="btn small" id="synSave">Enregistrer la synthèse</button></div>`}</div>
   ${siteReport(s)}
  </section>`;
  const slug=t=>String(t||"bureau").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase();
  const d8=new Date().toISOString().slice(0,10);
  document.getElementById("dlHtml").onclick=()=>save(`rapport-${slug(s.meta.nom)}-${d8}.html`,standalone(siteReport(s),"Rapport — "+(s.meta.nom||"")));
  document.getElementById("dlXls").onclick=()=>exportExcel([s],`data-ugp-${slug(s.meta.nom)}-${d8}`);
  document.getElementById("dlCsv").onclick=()=>save(`inventaire-${slug(s.meta.nom)}.csv`,csv([s]));
  const ab=document.getElementById("aiBtn");if(ab)ab.onclick=async()=>{const out=document.getElementById("aiOut");out.hidden=false;await aiSite(s,ab);if(s.meta.synthese){document.getElementById("synEdit").value=s.meta.synthese;out.hidden=true;renderReport()}};
  const ss=document.getElementById("synSave");if(ss)ss.onclick=()=>{s.meta.synthese=v("synEdit").trim();s.meta.syntheseAt=Date.now();s.updatedAt=Date.now();mark("s:"+s.id);log(s.id,"Synthèse modifiée");toast("Synthèse enregistrée");renderReport()};
}

function csv(list){const q=x=>{const t=String(x??"");return/[;"\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
  const rows=[["Bureau","Code","Province","Ville","Date visite","Domaine","Type","Marque","Modèle","N° série","Quantité","État","Emplacement","Année","Observations"]];
  list.forEach(s=>{const m=s.meta||{};DOMAINS.forEach(D=>{(domData(s,D.key).items||[]).forEach(i=>rows.push([m.nom,m.code,m.province,m.ville,m.date,D.label,i.type,i.marque,i.modele,i.serie,i.qte,i.etat,i.lieu,i.annee,i.obs]))})});
  return"﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n")}
function workbookSheets(list){
  const base=s=>[s.meta.nom,s.meta.code,s.meta.province,s.meta.ville,s.meta.date];const bh=["Bureau","Code","Province","Ville","Date visite"];
  const sheets=[];
  sheets.push(["Synthèse",[bh.concat(["Statut","Collecte %","Score global"],SCORED.map(k=>"Score "+SHORT[k]),["Alertes critiques","Avertissements","Unités d'équipement","Budget (USD)","Priorité"])]
    .concat(list.map(s=>{const ck=siteChecks(s);return base(s).concat([statutOf(s),siteStats(s).pct,siteScore(s)],SCORED.map(k=>domScore(s,k)),[ck.filter(c=>c.lv==="c").length,ck.filter(c=>c.lv==="w").length,siteStats(s).qty,siteBudget(s),domData(s,"besoins").fields.priorite||""])}))]);
  DOMAINS.forEach(D=>{const fl=domFields(D);sheets.push([SHORT[D.key],[bh.concat(fl.map(x=>x.l+(x.u?" ("+x.u+")":"")))].concat(list.map(s=>{const f=domData(s,D.key).fields||{};return base(s).concat(fl.map(x=>(!x.c||x.c(f))&&isFilled(f[x.k])?f[x.k]:""))}))])});
  sheets.push(["Inventaire",[bh.concat(["Domaine","Type","Marque","Modèle","N° série","Quantité","État","Emplacement","Année","Observations"])].concat(list.flatMap(s=>DOMAINS.flatMap(D=>(domData(s,D.key).items||[]).map(i=>base(s).concat([D.label,i.type,i.marque,i.modele,i.serie,Number(i.qte)||1,i.etat,i.lieu,i.annee,i.obs])))))]);
  sheets.push(["Plan d'action",[bh.concat(["Action","Article","Domaine","Priorité","Quantité","Prix unitaire (USD)","Coût (USD)","Responsable","Échéance"])].concat(list.flatMap(s=>actionsOf(s).map(a=>base(s).concat([a.action,a.article,a.dom&&DOM_BY[a.dom]?DOM_BY[a.dom].label:"",a.prio,Number(a.qte)||0,Number(a.pu)||0,(Number(a.qte)||0)*(Number(a.pu)||0),a.resp,a.delai]))))]);
  sheets.push(["Alertes",[bh.concat(["Niveau","Domaine","Alerte"])].concat(list.flatMap(s=>siteChecks(s).map(c=>base(s).concat([c.lv==="c"?"Critique":"À vérifier",DOM_BY[c.dom].label,c.msg]))))]);
  return sheets}
function exportExcel(list,name){const sheets=workbookSheets(list);
  if(window.XLSX){try{const wb=XLSX.utils.book_new();sheets.forEach(([n,rows])=>{const ws=XLSX.utils.aoa_to_sheet(rows);ws["!cols"]=rows[0].map((h,i)=>({wch:Math.min(40,Math.max(10,...rows.slice(0,50).map(r=>String(r[i]??"").length)))}));XLSX.utils.book_append_sheet(wb,ws,n.slice(0,31))});
    const out=XLSX.write(wb,{bookType:"xlsx",type:"array"});save(name+".xlsx",new Blob([out],{type:"application/vnd.openxmlformats-officedocument.spreadsheetml.sheet"}));return}catch(e){}}
  const x=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
  const xml=`<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="h"><Font ss:Bold="1"/><Interior ss:Color="#DCEBEF" ss:Pattern="Solid"/></Style></Styles>`+
   sheets.map(([n,rows])=>`<Worksheet ss:Name="${x(n.slice(0,31))}"><Table>${rows.map((r,ri)=>`<Row>${r.map(c=>`<Cell${ri?"":' ss:StyleID="h"'}><Data ss:Type="${typeof c==="number"?"Number":"String"}">${x(c)}</Data></Cell>`).join("")}</Row>`).join("")}</Table></Worksheet>`).join("")+`</Workbook>`;
  save(name+".xls",xml)}
function standalone(body,title){

.review{border-left:4px solid var(--info);background:var(--info-soft);padding:8px 12px;font-size:13px}.prose{white-space:pre-wrap;line-height:1.6}
.toc{columns:2;column-gap:24px;margin:0;padding-left:20px;font-size:13px}.sigs{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.sig{border:1px solid var(--line);border-radius:8px;padding:10px;min-height:110px;font-size:12.5px;display:flex;flex-direction:column;justify-content:space-between}
.rphotos{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.rphotos figure{margin:0;font-size:11px;color:var(--ink-3)}.rphotos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
@media print{body{margin:0}.rep h3{break-after:avoid}.rphotos figure,.sigs,tr{break-inside:avoid}}`;
  return`<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>${css}</style></head><body>${body}</body></html>`}
async function save(filename,data){
  if(!downloads){toast("L'export de fichiers n'est pas disponible ici.");return}
  try{await downloads.save({filename,data});toast("Fichier enregistré")}
  catch(e){const c=e&&e.code;if(c==="declined")return;if(c==="rate_limited")toast("Une demande d'enregistrement est déjà ouverte.");else toast("Export impossible dans cette vue.")}}

/* ---------------- Thème ---------------- */
const HOST_THEME=document.documentElement.getAttribute("data-theme");
function applyTheme(t){const r=document.documentElement;r.removeAttribute("data-contrast");
  if(t==="light"||t==="dark")r.setAttribute("data-theme",t);
  else if(t==="sun"){r.setAttribute("data-theme","light");r.setAttribute("data-contrast","high")}
  else{if(HOST_THEME)r.setAttribute("data-theme",HOST_THEME);else r.removeAttribute("data-theme")}}

/* ---------------- Paramètres ---------------- */
const QTYPES=[["text","Texte court"],["num","Nombre"],["seg","Choix (boutons)"],["state","État (Bon → Hors service)"],["date","Date"],["area","Texte long"]];
function settingsSheet(tab){
  tab=tab||"general";const sup=ME.sup;
  const tabs=[["general","Général"]];tab="general";
  let body="";
  if(tab==="general"){const th=prefs().theme||"auto";
    body=`<div class="f"><span class="lab" id="thl">Affichage</span><div class="seg" role="group" aria-labelledby="thl" id="thSeg">${[["auto","Automatique"],["light","Clair"],["dark","Sombre"],["sun","Plein soleil"]].map(([k,l])=>`<button type="button" data-v="${k}" aria-pressed="${k===th}">${l}</button>`).join("")}</div>
      <div class="fmsg i">« Plein soleil » renforce les contrastes et agrandit le texte pour la saisie en extérieur.</div></div>
     <div class="f"><span class="lab">Sauvegarde de sécurité</span><div class="row"><button class="btn small" id="expJson" ${downloads?"":"disabled"}>Exporter (.json)</button><label class="btn small" for="impJson">Importer une sauvegarde</label><input type="file" id="impJson" accept=".json,application/json" hidden></div>
      <div class="fmsg i">Contient tous les bureaux et leurs réponses (sans les photos).</div></div>
     <div class="hint">DATA-UGP · UGP-MOD · version 2.1. Application personnelle : données enregistrées sur l'appareil et sauvegardées dans votre espace quand le réseau est disponible.</div>`}
  else if(tab==="catalogue"){body=`<div class="hint">Prix unitaires indicatifs utilisés dans les plans d'action. Ajustez-les aux prix du marché ; les actions déjà saisies gardent leur prix.</div>
     <div class="stackv" id="catRows">${catalogue().map(c=>catRow(c)).join("")}</div>
     <div class="row"><button class="btn small" id="catAdd">+ Article</button><button class="btn small primary" id="catSave">Enregistrer le catalogue</button><button class="btn small" id="catReset">Revenir aux prix par défaut</button></div>`}
  else if(tab==="questions"){const dk=settingsSheet.dk||"site";const extra=(CFG.questions&&CFG.questions[dk])||[];
    body=`<div class="hint">Ajoutez des questions à un domaine sans modifier l'application. Elles apparaissent dans le questionnaire, le rapport et Excel.</div>
     <div class="f"><label for="qDom">Domaine</label><select id="qDom">${DOMAINS.map(D=>`<option value="${D.key}" ${D.key===dk?"selected":""}>${esc(D.label)}</option>`).join("")}</select></div>
     ${extra.length?`<div class="eq">${extra.map((q,i)=>`<div class="item"><div><b>${esc(q.l)}</b><div class="sub">${esc(QTYPES.find(t=>t[0]===q.t)?.[1]||q.t)}${q.o?" · "+esc(q.o.join(", ")):""}${q.u?" · "+esc(q.u):""}</div></div><button class="btn small danger" data-qdel="${i}">Retirer</button></div>`).join("")}</div>`:`<div class="muted" style="font-size:14px">Aucune question ajoutée à ce domaine.</div>`}
     <div class="card fields" style="background:var(--surface-2)"><div class="eyebrow">Nouvelle question</div>
      <div class="f"><label for="qL">Libellé</label><input id="qL" placeholder="ex. Présence d'un groupe de secours pour le scanner"></div>
      <div class="grid2"><div class="f"><label for="qT">Type de réponse</label><select id="qT">${QTYPES.map(([k,l])=>`<option value="${k}">${l}</option>`).join("")}</select></div>
       <div class="f"><label for="qU">Unité (facultatif)</label><input id="qU" placeholder="ex. kVA"></div></div>
      <div class="f"><label for="qO">Choix possibles (pour « Choix »), séparés par des virgules</label><input id="qO" placeholder="Oui, Non, Ne sait pas"></div>
      <div class="row"><button class="btn small primary" id="qAdd">Ajouter la question</button></div></div>`}
  else if(tab==="referentiel"){const txt=(CFG.referentiel||[]).map(r=>[r.nom,r.code,r.province,r.ville].map(x=>x||"").join(" ; ")).join("\n");
    body=`<div class="hint">Liste officielle des bureaux : une ligne par bureau, au format <span class="mono">Nom ; Code ; Province ; Ville</span>. À la création d'une fiche, le nom est proposé et le code, la province et la ville se remplissent seuls.</div>
     <div class="f"><label for="refTxt">${(CFG.referentiel||[]).length} bureau(x) dans le référentiel</label><textarea id="refTxt" class="mono" style="min-height:220px;font-size:13px" placeholder="Bureau de Kasumbalesa ; KSB ; Haut-Katanga ; Kasumbalesa">${esc(txt)}</textarea></div>
     <div class="row"><button class="btn small primary" id="refSave">Enregistrer le référentiel</button></div>`}
  openSheet(`<div class="grip"></div><div class="row spread"><h2 style="font-size:20px">Paramètres</h2><button class="btn small" data-close>Fermer</button></div>
   ${body}`);
  const H=document.getElementById("sheetHost");
  H.querySelectorAll("[data-tab]").forEach(b=>b.onclick=()=>settingsSheet(b.dataset.tab));
  const ts=document.getElementById("thSeg");if(ts)ts.querySelectorAll("button").forEach(b=>b.onclick=()=>{setPref("theme",b.dataset.v);applyTheme(b.dataset.v);ts.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x===b))});
  const ej=document.getElementById("expJson");if(ej)ej.onclick=()=>save(`data-ugp-sauvegarde-${new Date().toISOString().slice(0,10)}.json`,JSON.stringify({version:2,exportedAt:new Date().toISOString(),sites:S.sites},null,1));
  const ij=document.getElementById("impJson");if(ij)ij.onchange=importJson;
  const needDb=()=>{if(!db){toast("Connexion requise pour enregistrer ce réglage.");return false}return true};
  const ca=document.getElementById("catAdd");if(ca)ca.onclick=()=>{document.getElementById("catRows").insertAdjacentHTML("beforeend",catRow({id:uid(),label:"",prix:0}));bindCatDel()};
  const bindCatDel=()=>H.querySelectorAll("[data-catdel]").forEach(b=>b.onclick=()=>b.closest(".catrow").remove());bindCatDel();
  const cs=document.getElementById("catSave");if(cs)cs.onclick=async()=>{if(!needDb())return;const items=[...H.querySelectorAll(".catrow")].map(r=>({id:r.dataset.id,label:r.querySelector("[data-l]").value.trim(),prix:Number(r.querySelector("[data-p]").value)||0})).filter(x=>x.label);
    try{await db.doc("config/catalogue").set({items,at:Date.now(),by:ME.id||null});CFG.catalogue=items;toast("Catalogue enregistré")}catch(e){toast("Enregistrement impossible pour le moment. Réessayez.")}};
  const cr=document.getElementById("catReset");if(cr)cr.onclick=async()=>{if(!needDb())return;try{await db.doc("config/catalogue").set({items:DEFAULT_CATALOGUE,at:Date.now(),by:ME.id||null});CFG.catalogue=DEFAULT_CATALOGUE;settingsSheet("catalogue");toast("Prix par défaut rétablis")}catch(e){toast("Enregistrement impossible pour le moment. Réessayez.")}};
  const qd=document.getElementById("qDom");if(qd)qd.onchange=()=>{settingsSheet.dk=qd.value;settingsSheet("questions")};
  const saveQ=async(extra)=>{if(!needDb())return false;const all=Object.assign({},CFG.questions,{[settingsSheet.dk||"site"]:extra});try{await db.doc("config/questions").set({extra:all,at:Date.now(),by:ME.id||null});CFG.questions=all;return true}catch(e){toast("Enregistrement impossible pour le moment. Réessayez.");return false}};
  const qa=document.getElementById("qAdd");if(qa)qa.onclick=async()=>{const l=v("qL").trim();if(!l){toast("Saisissez le libellé de la question.");return}const t=v("qT");const o=v("qO").split(",").map(x=>x.trim()).filter(Boolean);
    if(t==="seg"&&o.length<2){toast("Indiquez au moins deux choix, séparés par des virgules.");return}
    const dk=settingsSheet.dk||"site";const extra=((CFG.questions&&CFG.questions[dk])||[]).concat([{k:"x_"+uid(),l,t,o:t==="seg"?o:undefined,u:v("qU").trim()||undefined}]).map(q=>JSON.parse(JSON.stringify(q)));
    if(await saveQ(extra)){toast("Question ajoutée");settingsSheet("questions")}};
  H.querySelectorAll("[data-qdel]").forEach(b=>b.onclick=async()=>{const dk=settingsSheet.dk||"site";const extra=((CFG.questions&&CFG.questions[dk])||[]).filter((_,i)=>i!==Number(b.dataset.qdel));if(await saveQ(extra)){toast("Question retirée (les réponses déjà saisies sont conservées)");settingsSheet("questions")}});
  const rs=document.getElementById("refSave");if(rs)rs.onclick=async()=>{if(!needDb())return;const bureaux=v("refTxt").split(/\r?\n/).map(l=>l.split(/[;\t]/).map(x=>x.trim())).filter(a=>a[0]).map(([nom,code,province,ville])=>({nom,code:code||"",province:PROVINCES.find(p=>norm(p)===norm(province))||province||"",ville:ville||""}));
    try{await db.doc("config/referentiel").set({bureaux,at:Date.now(),by:ME.id||null});CFG.referentiel=bureaux;toast(bureaux.length+" bureau(x) enregistré(s)");settingsSheet("referentiel")}catch(e){toast("Enregistrement impossible pour le moment. Réessayez.")}};
}
function catRow(c){return`<div class="catrow row" data-id="${esc(c.id)}" style="flex-wrap:nowrap"><input data-l class="search" style="flex:1" value="${esc(c.label)}" aria-label="Article" placeholder="Article"><input data-p class="search mono" style="flex:0 0 110px;min-width:0" type="number" min="0" inputmode="decimal" value="${esc(c.prix)}" aria-label="Prix en USD"><button class="btn small danger" data-catdel aria-label="Retirer">×</button></div>`}
function importJson(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);let n=0;
  Object.values(o.sites||{}).forEach(s=>{if(!s||!s.id)return;const cur=S.sites[s.id];if(cur&&(cur.updatedAt||0)>(s.updatedAt||0))return;S.sites[s.id]=s;S.dirty["s:"+s.id]=Date.now();Object.keys(s.domains||{}).forEach(k=>{if(DOM_BY[k])S.dirty["d:"+s.id+":"+k]=Date.now()});n++});
  lsSave();flushSoon();closeSheet();render();toast(n+" bureau(x) importé(s)")}catch(err){toast("Fichier illisible : choisissez une sauvegarde .json exportée depuis cette application.")}};r.readAsText(f)}

/* ---------------- Navigation ---------------- */
document.getElementById("navSites").onclick=()=>go("sites");
document.getElementById("navSite").onclick=()=>{if(view.site&&getSite(view.site))go("site",view.site)};
document.getElementById("navDash").onclick=()=>go("dash");
document.getElementById("navReport").onclick=()=>go("report",view.site);
document.getElementById("gearBtn").onclick=()=>settingsSheet();
document.getElementById("backBtn").onclick=()=>{if(view.name==="domain")go("site",view.site);else if(view.name==="report"&&view.site)go("site",view.site);else go("sites")};
window.addEventListener("online",flushSoon);

applyTheme(prefs().theme||"auto");
lsLoad();render();connect();
if('serviceWorker' in navigator&&!(window.claude&&window.claude.use))navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>

</body>
