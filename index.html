<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>InfraDouane</title>
<meta name="theme-color" content="#0E4A5C">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="InfraDouane">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<style>
[hidden]{display:none!important}
img{max-width:100%}
:root{
  --ink:#10232E; --ink-2:#3E5561; --ink-3:#6B808B;
  --ground:#EEF2F3; --surface:#FFFFFF; --surface-2:#F6F8F9; --line:#D5DEE2;
  --brand:#0E4A5C; --brand-ink:#FFFFFF; --brand-soft:#DCEBEF;
  --accent:#C98300; --accent-soft:#FCEFD3;
  --good:#1F7A4D; --good-soft:#DDF1E6; --warn:#B26A00; --warn-soft:#FBEBD0;
  --bad:#B3261E; --bad-soft:#F8DEDC; --off:#5B5B66; --off-soft:#E6E6EA;
  --shadow:0 6px 24px rgba(16,35,46,.12);
  --display:-apple-system,"SF Pro Display",system-ui,"Segoe UI",Roboto,sans-serif; --body:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif; --mono:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  color-scheme:dark;
  --ink:#E4ECEF; --ink-2:#AFC0C7; --ink-3:#7F939C;
  --ground:#0C171C; --surface:#13232A; --surface-2:#182C34; --line:#27404A;
  --brand:#5FB3C9; --brand-ink:#06202A; --brand-soft:#173A45;
  --accent:#F0AE3C; --accent-soft:#3A2C12;
  --good:#5CC38D; --good-soft:#123326; --warn:#E9A649; --warn-soft:#3A2A12;
  --bad:#F07B72; --bad-soft:#3B1917; --off:#A5A5B2; --off-soft:#2A2A31;
  --shadow:0 6px 24px rgba(0,0,0,.45);
}}
:root[data-theme="dark"]{
  color-scheme:dark;
  --ink:#E4ECEF; --ink-2:#AFC0C7; --ink-3:#7F939C;
  --ground:#0C171C; --surface:#13232A; --surface-2:#182C34; --line:#27404A;
  --brand:#5FB3C9; --brand-ink:#06202A; --brand-soft:#173A45;
  --accent:#F0AE3C; --accent-soft:#3A2C12;
  --good:#5CC38D; --good-soft:#123326; --warn:#E9A649; --warn-soft:#3A2A12;
  --bad:#F07B72; --bad-soft:#3B1917; --off:#A5A5B2; --off-soft:#2A2A31;
  --shadow:0 6px 24px rgba(0,0,0,.45);
}
*{box-sizing:border-box}
body{background:var(--ground);color:var(--ink);font:15px/1.5 var(--body);margin:0;padding-bottom:calc(76px + env(safe-area-inset-bottom,0px))}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 24px}
h1,h2,h3{font-family:var(--display);text-wrap:balance;margin:0;letter-spacing:-.01em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-3)}
.eyebrow{font:600 11px/1.2 var(--body);letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}

/* top bar */
.top{position:sticky;top:0;padding-top:env(safe-area-inset-top,0px);z-index:20;background:var(--brand);color:var(--brand-ink)}
.top .wrap{display:flex;align-items:center;gap:12px;padding-block:12px}
.top .back{background:none;border:0;color:inherit;font-size:22px;line-height:1;padding:4px 8px 4px 0}
.top .ttl{flex:1;min-width:0}
.top .ttl b{display:block;font:700 17px/1.2 var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.top .ttl small{font-size:12px;opacity:.8}
.sync{font:500 11px/1 var(--body);padding:6px 9px;border-radius:99px;background:rgba(255,255,255,.14);white-space:nowrap}
.sync.off{background:var(--accent);color:#1c1300}
.stripe{height:4px;background:repeating-linear-gradient(-45deg,var(--accent) 0 10px,var(--ink) 10px 20px);opacity:.9}

/* bottom nav */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav .in{max-width:760px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr)}
.nav button{background:none;border:0;padding:10px 4px 12px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;font-weight:500;color:var(--ink-3)}
.nav button svg{width:22px;height:22px}
.nav button[aria-current="true"]{color:var(--brand)}
.nav button:disabled{opacity:.35;cursor:default}

section.view{padding-top:18px;display:flex;flex-direction:column;gap:16px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.spread{justify-content:space-between}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;display:inline-flex;align-items:center;gap:8px}
.btn.primary{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.btn.accent{background:var(--accent);color:#1c1300;border-color:var(--accent)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:6px 10px;font-size:13px}
.btn.block{width:100%;justify-content:center}

/* site cards */
.sites{display:flex;flex-direction:column;gap:10px}
.site{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px;display:grid;grid-template-columns:1fr auto;gap:6px 12px;text-align:left;width:100%}
.site h3{font-size:17px}
.site{padding:0;overflow:hidden;display:block}
.site .open{all:unset;cursor:pointer;display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:14px;width:100%;box-sizing:border-box}
.site .open:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.site .acts{display:flex;border-top:1px solid var(--line)}
.site .acts button{flex:1;background:none;border:0;padding:10px;font-size:13.5px;font-weight:600;color:var(--brand)}
.site .acts button+button{border-left:1px solid var(--line)}
.site .acts .del{color:var(--bad)}
.hint{font-size:12.5px;color:var(--ink-3);margin-top:10px}
.site .meta{font-size:13px;color:var(--ink-2)}
.pct{font:700 20px/1 var(--display);color:var(--brand);text-align:right;font-variant-numeric:tabular-nums}
.bar{grid-column:1/-1;height:6px;border-radius:6px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar i{display:block;height:100%;background:var(--brand)}
.tag{display:inline-block;font:600 11px/1 var(--body);padding:4px 7px;border-radius:6px;background:var(--accent-soft);color:var(--warn);letter-spacing:.03em}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:18px;color:var(--ink-2);background:var(--surface)}

/* domain grid */
.domains{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media (max-width:420px){.domains{grid-template-columns:1fr}}
.dom{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 12px 10px;display:flex;flex-direction:column;gap:8px;text-align:left}
.dom .h{display:flex;gap:10px;align-items:center}
.dom .ic{width:36px;height:36px;border-radius:9px;background:var(--brand-soft);color:var(--brand);display:grid;place-items:center;flex:none}
.dom .ic svg{width:20px;height:20px}
.dom b{font:700 14.5px/1.2 var(--display)}
.dom .s{font-size:12px;color:var(--ink-3);display:flex;justify-content:space-between}
.dom .bar{height:5px}
.dom.done .ic{background:var(--good-soft);color:var(--good)}

/* forms */
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px}
.fields{display:flex;flex-direction:column;gap:14px}
.f label{display:block;font-size:13px;font-weight:600;color:var(--ink-2);margin-bottom:5px}
.f .unit{font-weight:400;color:var(--ink-3)}
.f input,.f select,.f textarea{width:100%;background:var(--surface-2);border:1px solid var(--line);border-radius:9px;padding:10px 11px;font-size:15px}
.f textarea{min-height:84px;resize:vertical}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg button{border:1px solid var(--line);background:var(--surface-2);border-radius:99px;padding:7px 12px;font-size:13.5px}
.seg button[aria-pressed="true"]{background:var(--brand);border-color:var(--brand);color:var(--brand-ink)}
.seg.st button[aria-pressed="true"][data-v="Bon"]{background:var(--good);border-color:var(--good);color:#fff}
.seg.st button[aria-pressed="true"][data-v="Passable"]{background:var(--warn);border-color:var(--warn);color:#fff}
.seg.st button[aria-pressed="true"][data-v="Mauvais"]{background:var(--bad);border-color:var(--bad);color:#fff}
.seg.st button[aria-pressed="true"][data-v="Hors service"]{background:var(--off);border-color:var(--off);color:#fff}

/* equipment list */
.eq{display:flex;flex-direction:column;gap:8px}
.item{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:11px 12px;border:1px solid var(--line);border-radius:11px;background:var(--surface-2);text-align:left;width:100%}
.item b{font-weight:600}
.item .sub{font-size:12.5px;color:var(--ink-2)}
.pill{font:600 11.5px/1 var(--body);padding:5px 8px;border-radius:99px;white-space:nowrap;align-self:start}
.p-Bon{background:var(--good-soft);color:var(--good)}
.p-Passable{background:var(--warn-soft);color:var(--warn)}
.p-Mauvais{background:var(--bad-soft);color:var(--bad)}
.p-Hors{background:var(--off-soft);color:var(--off)}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(6,18,24,.5);z-index:40;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:760px;max-height:92%;overflow:auto;border-radius:18px 18px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.sheet .grip{width:40px;height:4px;border-radius:4px;background:var(--line);margin:-6px auto 0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2{grid-template-columns:1fr}}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--ground);padding:10px 16px;border-radius:10px;z-index:60;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}

/* report */
.rep{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 16px;display:flex;flex-direction:column;gap:18px}
.rep h2{font-size:22px}
.rep h3{font-size:16px;padding-bottom:6px;border-bottom:2px solid var(--brand);color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:520px){.kpis{grid-template-columns:repeat(2,1fr)}}
.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px}
.kpi b{display:block;font:800 22px/1.1 var(--display);font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--ink-3)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;background:var(--surface-2);border:1px solid var(--line)}
.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--ink-2)}
.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
.tbl table{border-collapse:collapse;width:100%;font-size:13px}
.tbl th,.tbl td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
.tbl th{background:var(--surface-2);font-weight:600;color:var(--ink-2);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.kv{display:grid;grid-template-columns:minmax(120px,42%) 1fr;font-size:13.5px;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.kv div{padding:7px 10px;border-bottom:1px solid var(--line)}
.kv div:nth-child(odd){background:var(--surface-2);color:var(--ink-2)}
.kv div:nth-last-child(-n+2){border-bottom:0}
.alert{border-left:4px solid var(--bad);background:var(--bad-soft);padding:10px 12px;border-radius:0 10px 10px 0;font-size:13.5px}
.note{font-size:13px;color:var(--ink-2);background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .22s ease-out}@keyframes up{from{transform:translateY(30px);opacity:.6}}}
</style>
</head>

</div></nav>

function lsLoad(){try{const r=localStorage.getItem(LS);if(r){const o=JSON.parse(r);S.sites=o.sites||{};S.dirty=o.dirty||{};}}catch(e){}}

function uid(){return Date.now().toString(36)+Math.random().toString(36).slice(2,7)}
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function getSite(id){return id===DEMO_ID?DEMO:S.sites[id]}
function dom(site,key){site.domains=site.domains||{};if(!site.domains[key])site.domains[key]={fields:{},items:[]};const d=site.domains[key];d.fields=d.fields||{};d.items=d.items||[];return d}

function setSync(){const el=document.getElementById("sync");el.textContent="Sur ce téléphone";el.className="sync"}
// dirty keys: "s:<id>" meta, "d:<id>:<key>" domain, "x:<id>" deletion
function mark(k){S.dirty[k]=Date.now();lsSave();setSync();flushSoon()}
let flushT=null;function flushSoon(){clearTimeout(flushT);flushT=setTimeout(flush,700)}
async function flush(){
  if(!db)return;
  for(const k of Object.keys(S.dirty)){
    const [t,id,key]=k.split(":");
    try{
      if(t==="x"){
        await db.doc("sites/"+id).delete();
        for(const d of DOMAINS)await db.doc("domaines/"+id+"__"+d.key).delete();
      }else if(t==="s"){const s=S.sites[id];if(s)await db.doc("sites/"+id).set({meta:s.meta,createdAt:s.createdAt||Date.now(),updatedAt:s.updatedAt||Date.now()})}
      else if(t==="d"){const s=S.sites[id];if(s){const d=dom(s,key);await db.doc("domaines/"+id+"__"+key).set({siteId:id,key,fields:d.fields,items:d.items,updatedAt:d.updatedAt||Date.now()})}}
      delete S.dirty[k];
    }catch(e){ if(e&&e.code==="invalid_argument"){delete S.dirty[k];toast("Enregistrement refusé : droits d'écriture insuffisants.")} break;}
  }
  lsSave();setSync();
}

/* ---------------- Calculs ---------------- */
function isFilled(v){return !(v===undefined||v===null||v==="")}
function domStats(site,key){const D=DOM_BY[key];const d=(site.domains||{})[key]||{fields:{},items:[]};const f=d.fields||{};
  const filled=D.fields.filter(x=>isFilled(f[x.k])).length;return{filled,total:D.fields.length,items:(d.items||[]).length,pct:D.fields.length?Math.round(filled/D.fields.length*100):0}}
function siteStats(site){let filled=0,total=0,items=0,qty=0;const st={};STATES.forEach(s=>st[s]=0);
  DOMAINS.forEach(D=>{const s=domStats(site,D.key);filled+=s.filled;total+=s.total;const d=(site.domains||{})[D.key];(d&&d.items||[]).forEach(it=>{items++;const q=Number(it.qte)||1;qty+=q;if(st[it.etat]!==undefined)st[it.etat]+=q})});
  return{filled,total,pct:total?Math.round(filled/total*100):0,items,qty,st}}
function sitesSorted(){return Object.values(S.sites).sort((a,b)=>(b.updatedAt||0)-(a.updatedAt||0))}
function fmtDate(d){if(!d)return"—";const x=new Date(d+(String(d).length===10?"T00:00:00":""));return isNaN(x)?esc(d):x.toLocaleDateString("fr-FR",{day:"2-digit",month:"short",year:"numeric"})}
function fv(field,v){if(!isFilled(v))return"";if(field.t==="date")return fmtDate(v);return esc(v)+(field.u?" "+esc(field.u):"")}

function icon(k){return`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${I[k]}</svg>`}
function pillClass(e){return e==="Hors service"?"p-Hors":"p-"+e}

function importJson(e){const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const o=JSON.parse(r.result);let n=0;
  Object.values(o.sites||{}).forEach(s=>{if(!s||!s.id)return;const cur=S.sites[s.id];if(cur&&(cur.updatedAt||0)>(s.updatedAt||0))return;S.sites[s.id]=s;S.dirty["s:"+s.id]=Date.now();DOMAINS.forEach(D=>{if(s.domains&&s.domains[D.key])S.dirty["d:"+s.id+":"+D.key]=Date.now()});n++});
  lsSave();flushSoon();render();toast(n+" bureau(x) importé(s)")}catch(err){toast("Fichier illisible : choisissez une sauvegarde .json exportée depuis cette application.")}};r.readAsText(f)}

      <div class="note">Vous pouvez revenir modifier cette collecte à tout moment : chaque changement est enregistré automatiquement.${d.updatedAt?` Dernière modification : ${new Date(d.updatedAt).toLocaleString("fr-FR",{day:"2-digit",month:"short",hour:"2-digit",minute:"2-digit"})}.`:""}</div>
   <div class="row"><button class="btn primary" id="doneDom" style="flex:1;justify-content:center">Terminé · retour au bureau</button>
   ${s.demo?"":`<button class="btn danger" id="clearDom">Supprimer cette collecte</button>`}</div>
  </section>`;
  const commit=()=>{if(s.demo){toast("Exemple : créez un bureau pour enregistrer vos saisies.");return}d.updatedAt=Date.now();s.updatedAt=Date.now();clearTimeout(saveT);saveT=setTimeout(()=>{mark("d:"+s.id+":"+D.key);mark("s:"+s.id)},500)};
  app.querySelectorAll("#fields [data-k]").forEach(el=>{
    if(el.classList.contains("seg")){el.querySelectorAll("button").forEach(b=>b.onclick=()=>{const k=el.dataset.k;const nv=d.fields[k]===b.dataset.v?"":b.dataset.v;
      if(s.demo){toast("Exemple : créez un bureau pour enregistrer vos saisies.");return}
      d.fields[k]=nv;el.querySelectorAll("button").forEach(x=>x.setAttribute("aria-pressed",x.dataset.v===nv));commit()})}
    else el.addEventListener(el.tagName==="SELECT"?"change":"input",()=>{if(s.demo){el.value=d.fields[el.dataset.k]??"";toast("Exemple : créez un bureau pour enregistrer vos saisies.");return}
      d.fields[el.dataset.k]=el.type==="number"?(el.value===""?"":Number(el.value)):el.value;commit()})});
  const add=document.getElementById("addItem");if(add)add.onclick=()=>itemSheet(s,D,null);
  app.querySelectorAll("[data-item]").forEach(b=>b.onclick=()=>itemSheet(s,D,d.items.find(i=>i.id===b.dataset.item)));
  document.getElementById("doneDom").onclick=()=>go("site",view.site);
  const cd=document.getElementById("clearDom");if(cd)cd.onclick=()=>confirmSheet(`Supprimer la collecte « ${esc(D.label)} » ?`,`Les réponses du questionnaire et les ${d.items.length} équipement(s) de ce domaine seront effacés pour ce bureau. Les autres domaines ne sont pas touchés.`,"Supprimer la collecte",()=>{
    d.fields={};d.items=[];d.updatedAt=Date.now();s.updatedAt=Date.now();mark("d:"+s.id+":"+D.key);mark("s:"+s.id);toast("Collecte supprimée");go("site",s.id)});
}
function itemSheet(s,D,it){
  if(s.demo){toast("Exemple : créez un bureau pour enregistrer vos saisies.");return}
  const x=it||{type:D.equip[0],qte:1,etat:""};const d=dom(s,D.key);
  openSheet(`<div class="grip"></div><h2 style="font-size:20px">${it?"Modifier l'équipement":"Nouvel équipement"}</h2><div class="muted" style="margin-top:-8px;font-size:13px">${esc(D.label)}</div>
   <form id="itemForm" class="fields">
    <div class="f"><label for="i_type">Type d'équipement</label><select id="i_type">${D.equip.map(t=>`<option ${t===x.type?"selected":""}>${esc(t)}</option>`).join("")}</select></div>
    <div class="grid2"><div class="f"><label for="i_marque">Marque</label><input id="i_marque" value="${esc(x.marque)}"></div><div class="f"><label for="i_modele">Modèle</label><input id="i_modele" value="${esc(x.modele)}"></div></div>
    <div class="grid2"><div class="f"><label for="i_serie">N° de série / inventaire</label><input id="i_serie" class="mono" value="${esc(x.serie)}"></div><div class="f"><label for="i_qte">Quantité</label><input id="i_qte" type="number" min="1" inputmode="numeric" value="${esc(x.qte)}"></div></div>
    <div class="f"><label id="i_etat_l">État</label><div class="seg st" id="i_etat" role="group" aria-labelledby="i_etat_l">${STATES.map(o=>`<button type="button" data-v="${o}" aria-pressed="${o===x.etat}">${o}</button>`).join("")}</div></div>
    <div class="grid2"><div class="f"><label for="i_lieu">Emplacement</label><input id="i_lieu" value="${esc(x.lieu)}" placeholder="ex. Salle serveur"></div><div class="f"><label for="i_annee">Année d'acquisition</label><input id="i_annee" inputmode="numeric" value="${esc(x.annee)}"></div></div>
    <div class="f"><label for="i_obs">Observations</label><textarea id="i_obs">${esc(x.obs)}</textarea></div>
    <div class="row"><button class="btn primary" type="submit">Enregistrer</button><button class="btn" type="button" data-close>Annuler</button>${it?`<button class="btn danger" type="button" id="delItem" style="margin-left:auto">Supprimer</button>`:""}</div>
   </form>`);
  let etat=x.etat||"";const seg=document.getElementById("i_etat");
  seg.querySelectorAll("button").forEach(b=>b.onclick=()=>{etat=etat===b.dataset.v?"":b.dataset.v;seg.querySelectorAll("button").forEach(y=>y.setAttribute("aria-pressed",y.dataset.v===etat))});
  const done=()=>{d.updatedAt=Date.now();s.updatedAt=Date.now();mark("d:"+s.id+":"+D.key);mark("s:"+s.id);closeSheet();render()};
  document.getElementById("itemForm").onsubmit=ev=>{ev.preventDefault();
    const n={id:it?it.id:uid(),type:v("i_type"),marque:v("i_marque").trim(),modele:v("i_modele").trim(),serie:v("i_serie").trim(),qte:Math.max(1,Number(v("i_qte"))||1),etat,lieu:v("i_lieu").trim(),annee:v("i_annee").trim(),obs:v("i_obs").trim()};
    if(it)d.items[d.items.indexOf(it)]=n;else d.items.push(n);done();toast(it?"Équipement mis à jour":"Équipement ajouté")};
  const del=document.getElementById("delItem");
  if(del)del.onclick=()=>confirmSheet(`Supprimer « ${esc(it.type)} » ?`,`${esc([it.marque,it.modele,it.serie].filter(Boolean).join(" · ")||"Cet équipement")} sera retiré de l'inventaire.`,"Supprimer l'équipement",()=>{d.items=d.items.filter(i=>i!==it);done();toast("Équipement supprimé")});
}

/* ---------------- Sheet ---------------- */
function openSheet(html){const h=document.getElementById("sheetHost");h.innerHTML=`<div class="scrim" id="scrim"><div class="sheet" role="dialog" aria-modal="true">${html}</div></div>`;
  document.getElementById("scrim").onclick=e=>{if(e.target.id==="scrim"||e.target.hasAttribute("data-close"))closeSheet()};
  const first=h.querySelector("input,select,textarea");if(first)first.focus({preventScroll:true})}
function closeSheet(){document.getElementById("sheetHost").innerHTML=""}
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet()});

/* ---------------- Rapport ---------------- */
function kv(D,f){const rows=D.fields.filter(x=>isFilled(f[x.k]));if(!rows.length)return`<p class="muted" style="margin:0;font-size:13px">Aucune donnée saisie.</p>`;
  return`<div class="kv">${rows.map(x=>`<div>${esc(x.l)}</div><div>${fv(x,f[x.k])}</div>`).join("")}</div>`}
function eqTable(items){if(!items.length)return"";return`<div class="tbl"><table><thead><tr><th>Type</th><th>Marque / modèle</th><th>N° série</th><th>Qté</th><th>État</th><th>Emplacement</th><th>Observations</th></tr></thead><tbody>
  ${items.map(i=>`<tr><td>${esc(i.type)}</td><td>${esc([i.marque,i.modele].filter(Boolean).join(" "))}</td><td class="mono">${esc(i.serie)}</td><td class="mono">${esc(i.qte)}</td><td>${i.etat?`<span class="pill ${pillClass(i.etat)}">${esc(i.etat)}</span>`:""}</td><td>${esc(i.lieu)}</td><td>${esc(i.obs)}</td></tr>`).join("")}</tbody></table></div>`}
function g(s,k,f){const d=(s.domains||{})[k];return d&&d.fields?d.fields[f]:undefined}
function siteReport(s){
  const m=s.meta||{};const st=siteStats(s);const tot=STATES.reduce((a,x)=>a+st.st[x],0)||1;
  const crit=[];DOMAINS.forEach(D=>{const d=(s.domains||{})[D.key];(d&&d.items||[]).forEach(i=>{if(i.etat==="Hors service"||i.etat==="Mauvais")crit.push({...i,dom:D.label})})});
  const ind=[["Connexion Internet",g(s,"reseau","connexion")],["Débit mesuré",isFilled(g(s,"reseau","debit_m"))?g(s,"reseau","debit_m")+" Mbps":""],["Courant SNEL",isFilled(g(s,"energie","h_snel"))?g(s,"energie","h_snel")+" h/jour":g(s,"energie","snel")],["Groupe électrogène",g(s,"energie","groupe")],["SYDONIA",g(s,"systemes","sydonia")],["Pont bascule",g(s,"pesage","present")],["Scanner conteneurs",g(s,"scanners","sc_cont")],["Priorité globale",g(s,"besoins","priorite")]];
  return`<div class="rep" id="repBody">
   <div><div class="eyebrow">Rapport d'état des lieux · UGP-MOD</div><h2>${esc(m.nom||"Bureau")}</h2>
   <div class="muted" style="font-size:13.5px">${[m.province,m.ville].filter(Boolean).map(esc).join(" · ")}${m.code?` · Code <span class="mono">${esc(m.code)}</span>`:""}<br>Visite du ${fmtDate(m.date)}${m.agent?" · Enquêteur : "+esc(m.agent):""}${m.resp?" · Chef de bureau : "+esc(m.resp):""}<br>Rapport généré le ${new Date().toLocaleDateString("fr-FR",{day:"2-digit",month:"long",year:"numeric"})}</div></div>
   <div class="kpis"><div class="kpi"><b>${st.pct}%</b><span>Collecte complétée</span></div><div class="kpi"><b>${st.qty}</b><span>Unités d'équipement</span></div>
    <div class="kpi"><b style="color:var(--bad)">${st.st["Hors service"]+st.st["Mauvais"]}</b><span>Mauvais ou hors service</span></div><div class="kpi"><b>${esc(g(s,"besoins","priorite")||"—")}</b><span>Priorité</span></div></div>
   <div><h3>Synthèse</h3>
    <div style="margin-top:10px" class="stack" role="img" aria-label="Répartition des équipements par état">${STATES.map(x=>st.st[x]?`<i style="width:${st.st[x]/tot*100}%;background:${STATE_COLOR[x]}" title="${x} : ${st.st[x]}"></i>`:"").join("")}</div>
    <div class="legend" style="margin-top:8px">${STATES.map(x=>`<span style="--c:${STATE_COLOR[x]}">${x} <b class="mono">${st.st[x]}</b></span>`).join("")}</div>
    <div class="kv" style="margin-top:12px">${ind.map(([l,x])=>`<div>${l}</div><div>${isFilled(x)?esc(x):'<span class="muted">non renseigné</span>'}</div>`).join("")}</div></div>
   ${crit.length?`<div><h3>Points critiques</h3><div style="display:flex;flex-direction:column;gap:6px;margin-top:10px">${crit.map(i=>`<div class="alert"><b>${esc(i.type)}</b> ${esc([i.marque,i.modele].filter(Boolean).join(" "))} — ${esc(i.etat)} <span class="muted">(${esc(i.dom)})</span>${i.obs?"<br>"+esc(i.obs):""}</div>`).join("")}</div></div>`:""}
   ${DOMAINS.map(D=>{const d=(s.domains||{})[D.key]||{fields:{},items:[]};const x=domStats(s,D.key);
     return`<div style="display:flex;flex-direction:column;gap:10px"><h3>${D.label} <span class="muted" style="font:500 12px var(--body)">· ${x.filled}/${x.total} rubriques</span></h3>${kv(D,d.fields||{})}${eqTable(d.items||[])}</div>`}).join("")}
  </div>`}
function globalTable(){const list=sitesSorted();if(!list.length)return"";
  return`<div class="card"><div class="eyebrow" style="margin-bottom:10px">Synthèse de tous les bureaux</div><div class="tbl"><table><thead><tr><th>Bureau</th><th>Province</th><th>Collecte</th><th>Unités</th><th>Mauv./HS</th><th>Connexion</th><th>Priorité</th></tr></thead><tbody>
   ${list.map(s=>{const st=siteStats(s);return`<tr><td><a href="#" data-rep="${esc(s.id)}" style="color:var(--brand)">${esc(s.meta&&s.meta.nom)}</a></td><td>${esc(s.meta&&s.meta.province)}</td><td class="mono">${st.pct}%</td><td class="mono">${st.qty}</td><td class="mono">${st.st["Mauvais"]+st.st["Hors service"]}</td><td>${esc(g(s,"reseau","connexion")||"—")}</td><td>${esc(g(s,"besoins","priorite")||"—")}</td></tr>`}).join("")}</tbody></table></div></div>`}
function renderReport(){
  const s=view.site&&getSite(view.site);
  setTop("Rapport",s?(s.meta&&s.meta.nom)||"":"Tous les bureaux",!!s);
  const dlNote=downloads?"":`<div class="note">L'export de fichiers n'est pas disponible dans cette vue. Le rapport reste consultable ci-dessous.</div>`;
  app.innerHTML=`<section class="view">
   ${s?`<div class="card"><div class="eyebrow" style="margin-bottom:10px">Exporter</div><div class="row">
     <button class="btn small primary" id="dlHtml" ${downloads?"":"disabled"}>Rapport du bureau (.html)</button>
     <button class="btn small" id="dlCsv" ${downloads?"":"disabled"}>Inventaire (.csv / Excel)</button></div>
     <div class="muted" style="font-size:12.5px;margin-top:8px">Le fichier .html s'ouvre dans n'importe quel navigateur ou dans Word, et s'imprime en PDF.</div></div>${dlNote}${siteReport(s)}`
    :`<div class="empty">Choisissez un bureau pour afficher son rapport détaillé.</div>`}
   ${globalTable()}
   ${Object.keys(S.sites).length?`<div class="card"><div class="eyebrow" style="margin-bottom:10px">Export consolidé</div><div class="row"><button class="btn small" id="dlAllCsv" ${downloads?"":"disabled"}>Inventaire de tous les bureaux (.csv)</button><button class="btn small" id="dlAllHtml" ${downloads?"":"disabled"}>Rapport consolidé (.html)</button></div></div>`:""}
  </section>`;
  app.querySelectorAll("[data-rep]").forEach(a=>a.onclick=e=>{e.preventDefault();go("report",a.dataset.rep)});
  const slug=t=>String(t||"bureau").normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^A-Za-z0-9]+/g,"-").replace(/^-|-$/g,"").toLowerCase();
  const b1=document.getElementById("dlHtml");if(b1)b1.onclick=()=>save(`rapport-${slug(s.meta.nom)}-${new Date().toISOString().slice(0,10)}.html`,standalone(siteReport(s),"Rapport — "+(s.meta.nom||"")));
  const b2=document.getElementById("dlCsv");if(b2)b2.onclick=()=>save(`inventaire-${slug(s.meta.nom)}.csv`,csv([s]));
  const b3=document.getElementById("dlAllCsv");if(b3)b3.onclick=()=>save(`inventaire-tous-bureaux-${new Date().toISOString().slice(0,10)}.csv`,csv(sitesSorted()));
  const b4=document.getElementById("dlAllHtml");if(b4)b4.onclick=()=>save(`rapport-consolide-${new Date().toISOString().slice(0,10)}.html`,standalone(globalTable()+sitesSorted().map(siteReport).join('<div style="page-break-after:always"></div>'),"Rapport consolidé UGP-MOD"));
}
function csv(list){const q=x=>{const t=String(x??"");return/[;"\n]/.test(t)?'"'+t.replace(/"/g,'""')+'"':t};
  const rows=[["Bureau","Code","Province","Ville","Date visite","Domaine","Type","Marque","Modèle","N° série","Quantité","État","Emplacement","Année","Observations"]];
  list.forEach(s=>{const m=s.meta||{};DOMAINS.forEach(D=>{const d=(s.domains||{})[D.key];(d&&d.items||[]).forEach(i=>rows.push([m.nom,m.code,m.province,m.ville,m.date,D.label,i.type,i.marque,i.modele,i.serie,i.qte,i.etat,i.lieu,i.annee,i.obs]))})});
  return"﻿"+rows.map(r=>r.map(q).join(";")).join("\r\n")}
function standalone(body,title){
  const css=`:root{--ink:#10232E;--ink-2:#3E5561;--ink-3:#6B808B;--surface:#fff;--surface-2:#F4F7F8;--line:#D5DEE2;--brand:#0E4A5C;--good:#1F7A4D;--good-soft:#DDF1E6;--warn:#B26A00;--warn-soft:#FBEBD0;--bad:#B3261E;--bad-soft:#F8DEDC;--off:#5B5B66;--off-soft:#E6E6EA;--display:Arial,Helvetica,sans-serif;--body:Arial,Helvetica,sans-serif}
body{font:14px/1.5 Arial,Helvetica,sans-serif;color:var(--ink);max-width:900px;margin:24px auto;padding:0 20px}h2,h3{margin:0}.mono{font-family:Consolas,monospace}.muted{color:var(--ink-3)}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3);font-weight:bold}
.rep,.card{display:flex;flex-direction:column;gap:18px;margin-bottom:28px}.rep h2{font-size:24px}.rep h3{font-size:16px;padding-bottom:6px;border-bottom:2px solid var(--brand);color:var(--brand)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.kpi{border:1px solid var(--line);border-radius:8px;padding:10px;background:var(--surface-2)}.kpi b{display:block;font-size:22px}.kpi span{font-size:12px;color:var(--ink-3)}
.stack{display:flex;height:14px;border-radius:7px;overflow:hidden;border:1px solid var(--line);-webkit-print-color-adjust:exact;print-color-adjust:exact}.stack i{display:block;height:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px}.legend span::before{content:"";display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;background:var(--c);vertical-align:-1px}
table{border-collapse:collapse;width:100%;font-size:12.5px}th,td{padding:6px 8px;border:1px solid var(--line);text-align:left;vertical-align:top}th{background:var(--surface-2)}
.kv{display:grid;grid-template-columns:40% 1fr;font-size:13px;border:1px solid var(--line)}.kv div{padding:6px 10px;border-bottom:1px solid var(--line)}.kv div:nth-child(odd){background:var(--surface-2);color:var(--ink-2)}
.alert{border-left:4px solid var(--bad);background:var(--bad-soft);padding:8px 12px;font-size:13px}.pill{font-size:11px;font-weight:bold;padding:3px 7px;border-radius:99px;white-space:nowrap}
.p-Bon{background:var(--good-soft);color:var(--good)}.p-Passable{background:var(--warn-soft);color:var(--warn)}.p-Mauvais{background:var(--bad-soft);color:var(--bad)}.p-Hors{background:var(--off-soft);color:var(--off)}
a{color:inherit;text-decoration:none}@media print{body{margin:0}.rep h3{break-after:avoid}}`;
  return`<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>${esc(title)}</title><style>${css}</style></head><body>${body}</body></html>`}
async function save(filename,data){
  const ext=filename.split(".").pop();const type={html:"text/html",csv:"text/csv",json:"application/json"}[ext]||"application/octet-stream";
  const blob=new Blob([data],{type:type+";charset=utf-8"});
  try{const file=new File([blob],filename,{type});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:filename});return}}catch(e){if(e&&e.name==="AbortError")return}
  const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=filename;document.body.appendChild(a);a.click();
  setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},4000);toast("Fichier prêt : "+filename)}
/* ---------------- Navigation ---------------- */
document.getElementById("navSites").onclick=()=>go("sites",view.site);
document.getElementById("navSite").onclick=()=>{if(view.site&&getSite(view.site))go("site",view.site)};
document.getElementById("navReport").onclick=()=>go("report",view.site);
document.getElementById("backBtn").onclick=()=>{if(view.name==="domain")go("site",view.site);else if(view.name==="report"&&view.site)go("site",view.site);else go("sites",view.site)};
window.addEventListener("online",flushSoon);

lsLoad();render();connect();
if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
})();
</script>
